name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinAcmeGui.sln

      - name: Build
        run: dotnet build WinAcmeGui.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/WinAcmeGui.Core.Tests/WinAcmeGui.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinAcmeGui.sln

      - name: Test
        run: dotnet test tests/WinAcmeGui.Core.Tests/WinAcmeGui.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Build
        run: dotnet build WinAcmeGui.sln -c Release --no-restore

      # The same publish the release workflow runs. Doing it here too means a
      # single-file self-contained WinForms publish is proven on every push,
      # rather than being discovered as broken at tag time, and it leaves a
      # runnable exe attached to the run for testing without cutting a release.
      - name: Publish single-file exe
        run: >
          dotnet publish src/WinAcmeGui/WinAcmeGui.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: win-acme-gui-exe
          path: publish/win-acme-gui.exe
          if-no-files-found: error
